name: Run Windows Executable

on:
  push:
    paths:
      - 'mp3scraper/bin/Release/mp3scraper.exe.config'   # تشغيل فقط عند تعديل هذا الملف
  workflow_dispatch:   # تشغيل يدوي إذا لزم

jobs:
  run-exe:
    runs-on: windows-latest # Use a Windows runner
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Get your repository content
      with:
          # نحتاج صلاحية الكتابة للفرع لتتمكن من رفع التغييرات
          persist-credentials: true
          fetch-depth: 0
          
    - name: Run the executable
      run: .\mp3scraper\bin\Release\mp3scraper.exe  # Adjust path and arguments as needed

    - name: Upload generated file      
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.run_id }} #${{ needs.run-exe.outputs.output1 }}
        path: .\mp3scraper\bin\Release\podcasts\ # Replace with the actual path
        compression-level: 9
        if-no-files-found: ignore

      # 4️⃣ إضافة الملف المُولَّد إلى المستودع نفسه
      - name: Commit generated files back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # إضافة كل ما تم توليده داخل مجلد podcasts
          git add mp3scraper/bin/Release/podcasts/
          # إذا لم يحدث أي تغيير، نتخطى الخطوة
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add generated podcasts (auto‑generated by workflow)"
          git push
        env:
          # يستخدم الـ token الافتراضي الممنوح للـ workflow
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
