name: Run Windows Executable

on:
  workflow_run:
    workflows: ["HTML"]
    types: [completed]
  #workflow_call:
  push:
   # branches: [ dev ]
    paths:
      - mp3scraper/bin/Release/mp3scraper.exe.config   # تشغيل فقط عند تعديل هذا الملف         
  workflow_dispatch:

permissions:
  actions: read



jobs:
  run-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          
      - name: تحقق من وجود تعديل للملف
        id: check
        run: |
          git fetch origin
          if git diff --name-only ${{ github.event.workflow_run.head_commit.id }}..HEAD | grep -q '^mp3scraper/bin/Release/mp3scraper.exe.config$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Run the executable
        run: .\mp3scraper\bin\Release\mp3scraper.exe

      - name: Upload generated file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.run_id }}
          path: .\mp3scraper\bin\Release\podcasts\
       #   archive: false
          compression-level: 9
          if-no-files-found: ignore

      # 4️⃣ إضافة الملف المُولَّد إلى المستودع نفسه
      - name: Commit generated files back to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mp3scraper/bin/Release/podcasts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add generated podcasts (auto‑generated by workflow)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
