name: albadr تفسير-السعدي grab and build
run-name:  البحث عن درس جديد من - شرح تفسير السعدي | الشيخ د. عبدالرزاق البدر

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write   

jobs:
  fetch-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # -------------------------------------------------
      # 1️⃣ جلب نسخة من المستودع (مطلوب للـ git commit)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0   # احصل على التاريخ الكامل للسماح بالـ push
          persist-credentials: true
          token: ${{ secrets.R_token }}  

     # - name: Checkout target repo
     #   uses: actions/checkout@v6
     #   with:
     #     repository: dev-fos/islampodcast   # استبدل بـ <المنظمة>/<المستودع>
     #     token: ${{ secrets.R_token }}   # لا تحتاج PAT
     #     path: target-repo
     #     fetch-depth: 0
     #     persist-credentials: true
          
      #- name: Show repository file tree
      #  run: |
      #    echo "📂 شجرة المستودع المستنسخ (target‑repo):"
      #    # إذا كان الأمر tree مثبتًا فستظهر شجرة بألوان وتنسيق أفضل
      #    if command -v tree >/dev/null; then
      #      tree target-repo
      #    else
      #      # fallback إلى ls -R مع تنسيق واضح
      #      ls -R target-repo | sed 's/^/   /'
      #    fi          
      
      # -------------------------------------------------
      # 2️⃣ قراءة رقم الصفحة الأخير (أو البدء من 360)
      # -------------------------------------------------
      - name: Get last page number
        id: get_page
        run: |
          if [[ -f al-badr/تفسير-السعدي/next_mp3.txt ]]; then
            PAGE=$(cat al-badr/تفسير-السعدي/next_mp3.txt)
          else
            PAGE=360
          fi
          echo "page=${PAGE}" >> $GITHUB_OUTPUT
          
      - name: Set padded number
        id: pad
        run: |
          # احصل على الرقم من الإدخال
          raw="$(( ${{ steps.get_page.outputs.page }} + 1 ))"
          # تنسيق إلى 4 أرقام مع أصفار من اليسار
          printf -v padded "%04d" "$raw"
          echo "padded=$padded" >> "$GITHUB_OUTPUT"
          
      # -------------------------------------------------
      # 3️⃣ بناء الرابط الكامل
      # -------------------------------------------------
      - name: Build URL
        id: build_url
        run: |
          BASE="https://www.al-badr.net/sub/456/?q=&page="
          URL="${BASE}${{ steps.get_page.outputs.page }}"
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Using page ${{ steps.get_page.outputs.page }} → $URL"

      # -------------------------------------------------
      # 4️⃣ تحميل → تنظيف بـ perl → استخراج الأسطر المطلوبة
      # -------------------------------------------------
      - name: Download, clean with Perl, and extract required lines
        id: extract
        run: |
          # عنوان الصفحة
          URL="${{ steps.build_url.outputs.url }}"

          title="eTitle0001"
          new_title="${title%????}${{ steps.pad.outputs.padded }}"
          
          # 1️⃣ تحميل الصفحة
          # 2️⃣ تطبيق قاعدة الاستبدال بـ perl (‑0777 يقرأ كل النص ككتلة واحدة)
          # 3️⃣ استخراج <h3> و .mp3 من التيار المُنقّى
          # 4️⃣ حفظ النتيجة المؤقتة في result.txt (يمكن إلغاؤها إذا لا تريد ملفاً نهائياً)
          curl -sSL "$URL" \
            | perl -0777 -pe '
                s{<h3>(.*)">}{<add key="eTitle${{ steps.pad.outputs.padded }}" value="}g;
                s{</a></h3>}{" />}g;
                s{<span>(.*)<span>}{}g;
                s{href="/}{href="https://www.al-badr.net/}g;     
                s{<img(.*)</div>}{}g;
                s{U+202C}{}gm;
                s{^\s+}{}gm;               
              ' \
            | tee >(grep "eTitle" > h3_lines.txt) \
                  >(grep "\.mp3" > mp3_lines.txt) \
                  > /dev/null
      
          # دمج النتائج في ملف واحد (إذا أردت الاحتفاظ به)
          cat h3_lines.txt mp3_lines.txt > result.txt
      
          echo "=== النتائج المستخرجة بعد تنظيف perl ==="
          cat result.txt

          
      # -------------------------------------------------
      # 6️⃣ **تحقق من وجود سطر ‎*.mp3*‎ – إذا لم يوجد → إيقاف**
      # -------------------------------------------------
      - name: Fail if no mp3 lines found
        id: check_mp3
        run: |
          if [[ -s mp3_lines.txt ]]; then
            echo "has_mp3=true" >> $GITHUB_OUTPUT
            echo "✅ تم العثور على سطر (أسطر) .mp3"
          else
            echo "has_mp3=false" >> $GITHUB_OUTPUT
            echo "⚠️ لا يوجد أي سطر يحتوي على .mp3"
          fi
          
      # -------------------------------------------------
      # 7️⃣ مقارنة النتيجة مع al-badr/تفسير-السعدي/last_mp3.html
      # -------------------------------------------------
     # - name: Compare with previous result
     #   if: steps.check_mp3.outputs.has_mp3 == 'true'
     #   id: compare
     #   run: |
     #     # إذا كان الملف السابق غير موجود نعتبره فارغاً
     #     if [[ ! -f al-badr/تفسير-السعدي/last_mp3.html ]]; then
     #       touch al-badr/تفسير-السعدي/last_mp3.html
     #     fi

     #     # استخدم diff لإيجاد الاختلافات
     #     if diff -q result.txt al-badr/تفسير-السعدي/last_mp3.html > /dev/null; then
     #       echo "changed=false" >> $GITHUB_OUTPUT
     #     else
     #       echo "changed=true" >> $GITHUB_OUTPUT
     #     fi

      # -------------------------------------------------
      # 8️⃣ إذا كان هناك اختلاف → تحديث al-badr/تفسير-السعدي/last_mp3.html
      # -------------------------------------------------
      - name: Update last_mp3.html
      #  if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        run: |
          cp mp3_lines.txt al-badr/تفسير-السعدي/last_mp3.html
          echo "تم تحديث al-badr/تفسير-السعدي/last_mp3.html بالنتائج الجديدة"
          cat mp3_lines.txt
          cat al-badr/تفسير-السعدي/last_mp3.html
          
     # - name: Update last_mp3.html in target repo
     #   if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
     #   run: |
     #     cp mp3_lines.txt target-repo/mp3-url/al-badr-tafsir-assidi.html
     #     echo "تم تحديث target-repo/al-badr/تفسير-السعدي/last_mp3.html بالنتائج الجديدة"
          
     # - name: Commit & push changes
     #   if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
     #   working-directory: target-repo
     #   run: |
     #     git config user.name  "github-actions[bot]"
     #     git config user.email "github-actions[bot]@users.noreply.github.com"
     #     git add mp3-url/al-badr-tafsir-assidi.html
     #     git commit -m "Update last_mp3.html with new results" || echo "Nothing to commit"
     #     git push origin HEAD:main

      # -------------------------------------------------
      # 9️⃣ حساب رقم الصفحة التالي وكتابته في الملف
      # -------------------------------------------------
      - name: Prepare next_mp3.txt
        id: prep_next
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        run: |
          NEXT=$(( ${{ steps.get_page.outputs.page }} + 1 ))
          echo "$NEXT" > al-badr/تفسير-السعدي/next_mp3.txt
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          
      # 2️⃣ تعريف مسار الملف (احرص على وضعه داخل علامات اقتباس)
      - name: Define file path
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        id: vars
        run: |
          echo "FILE=al-badr/تفسير-السعدي/mp3scraper.exe.config" >> $GITHUB_OUTPUT
          
      - name: Build replacement block
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        id: build
        env:
          TEXT_BEFORE: |
           <add key="Title0001" value="true"/>
          TEXT_AFTER: |
           <add key="episodesBeginning0001" value="${{ steps.prep_next.outputs.next }}"/>
        run: |
          # النص الثابت المطلوب وضعه في البداية
            
          # قراءة محتوى h3_lines.txt (يمكن أن يحتوي على عدة أسطر)
          RESULT=$(cat h3_lines.txt)

          # دمج النص الثابت مع المحت

          REPLACEMENT="${TEXT_BEFORE}"$'\n'"${RESULT}"$'\n'"${TEXT_AFTER}"
          
          echo "merged<<EOF" >> $GITHUB_OUTPUT
          echo "REPLACEMENT"      >> $GITHUB_OUTPUT
          echo "EOF"          >> $GITHUB_OUTPUT
          
          # هروب سطور جديدة لأن GitHub Actions يتعامل مع قيمة واحدة في السطر
          REPLACEMENT_ESCAPED="${REPLACEMENT//$'\n'/\\n}"
          
          echo "replacement<<EOF" >> $GITHUB_OUTPUT
          echo "$REPLACEMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        
 
      # 3️⃣ البحث / الاستبدال باستخدام perl (regex مع وضع التعليقات)
      - name: Update mp3scraper.exe.config
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        env:
          FILE: ${{ steps.vars.outputs.FILE }}
          REPLACEMENT: ${{ steps.build.outputs.replacement }}
        run: |
          perl -0777 -i -pe '
            s{<add\s+key="Title0001"\s+value="true"/>.*?<add\s+key="episodesBeginning0001"[^>]*>}
             {
             $ENV{REPLACEMENT}
             }gs;  
            s{
             </channel>\s*</rss>\s*
              }{}gsx;  
          ' "$FILE"

          # تحقق سريع من النتائج (اختياري)
          echo "=== عينة من الملف بعد الاستبدال ==="
          head -n 20 "$FILE"
          

      # -------------------------------------------------
      # 10️⃣ الالتزام بالملف المحدث
      # -------------------------------------------------
          
      - name: Commit next_mp3.txt
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update next_mp3 to ${{ steps.prep_next.outputs.next }}"
          file_pattern: "al-badr/تفسير-السعدي/next_mp3.txt"

      - name: Commit last_mp3
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update last_mp3"
          # نضمن إضافة كل من last_mp3.html و next_mp3.txt
          file_pattern: "al-badr/تفسير-السعدي/last_mp3.html"
          
      - name: Commit mp3scraper.exe.config
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with: 
          token: ${{ secrets.R_token }}  
          commit_message: "Update mp3scraper.exe.config"
          file_pattern: "al-badr/تفسير-السعدي/mp3scraper.exe.config"
