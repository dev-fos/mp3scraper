name: HTML

on:
  push:
    branches: [dev]
  workflow_dispatch:        # تشغيل يدوي

jobs:
  fetch-and-extract:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1️⃣ جلب نسخة من المستودع (مطلوب للـ git commit)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # احصل على التاريخ الكامل للسماح بالـ push

      # -------------------------------------------------
      # 2️⃣ قراءة رقم الصفحة الأخير (أو البدء من 360)
      # -------------------------------------------------
      - name: Get last page number
        id: get_page
        run: |
          if [[ -f data/next_page.txt ]]; then
            PAGE=$(cat data/next_page.txt)
          else
            PAGE=360
          fi
          echo "page=${PAGE}" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 3️⃣ بناء الرابط الكامل
      # -------------------------------------------------
      - name: Build URL
        id: build_url
        run: |
          BASE="https://www.al-badr.net/sub/456/?q=&page="
          URL="${BASE}${{ steps.get_page.outputs.page }}"
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Using page ${{ steps.get_page.outputs.page }} → $URL"

      # -------------------------------------------------
      # 4️⃣ تحميل الصفحة HTML
      # -------------------------------------------------
      - name: Download HTML page
        id: download
        run: |
          curl -sSL "${{ steps.build_url.outputs.url }}" -o page.html
          echo "file=page.html" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 5️⃣ استخراج الأسطر المطلوبة
      # -------------------------------------------------
      - name: Extract required lines
        id: extract
        run: |
          grep "<h3>" "${{ steps.download.outputs.file }}" > h3_lines.txt || true
          grep "\.mp3" "${{ steps.download.outputs.file }}" > mp3_lines.txt || true
          cat h3_lines.txt mp3_lines.txt > result.txt
          echo "=== النتائج المستخرجة ==="
          cat result.txt
      # -------------------------------------------------
      # 6️⃣ **تحقق من وجود سطر ‎*.mp3*‎ – إذا لم يوجد → إيقاف**
      # -------------------------------------------------
      - name: Fail if no mp3 lines found
        id: check_mp3
        run: |
          if [[ ! -s mp3_lines.txt ]]; then
            echo "⚠️ لا يوجد أي سطر يحتوي على .mp3"
            exit 1   # ينتج خطأ ويوقف الـ workflow
          fi
          echo "✅ تم العثور على سطر (أسطر) .mp3"
          
      # -------------------------------------------------
      # 6️⃣ رفع النتيجة كـ artifact (اختياري)
      # -------------------------------------------------
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: extraction-result
          path: result.txt

      # -------------------------------------------------
      # 7️⃣ مقارنة النتيجة مع data/last.txt
      # -------------------------------------------------
      - name: Compare with previous result
        id: compare
        run: |
          # إذا كان الملف السابق غير موجود نعتبره فارغاً
          if [[ ! -f data/last.txt ]]; then
            touch data/last.txt
          fi

          # استخدم diff لإيجاد الاختلافات
          if diff -q result.txt data/last.txt > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------
      # 8️⃣ إذا كان هناك اختلاف → تحديث data/last.txt
      # -------------------------------------------------
      - name: Update last.txt
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp result.txt data/last.txt
          echo "تم تحديث data/last.txt بالنتائج الجديدة"

      # -------------------------------------------------
      # 9️⃣ حساب رقم الصفحة التالي وكتابته في الملف
      # -------------------------------------------------
      - name: Prepare next_page.txt
        id: prep_next
        if: steps.compare.outputs.changed == 'true'   # فقط إذا كان هناك تغيير
        run: |
          NEXT=$(( ${{ steps.get_page.outputs.page }} + 1 ))
          mkdir -p data
          echo "$NEXT" > data/next_page.txt
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 10️⃣ الالتزام بالملف المحدث
      # -------------------------------------------------
      #- name: Commit next_page.txt
      #  if: steps.compare.outputs.changed == 'true'
      #  uses: stefanzweifel/git-auto-commit-action@v5
      #  with:
      #    commit_message: "Update next page to ${{ steps.prep_next.outputs.next }}"
      #    file_pattern: "data/next_page.txt"

      - name: Commit updates
        if: steps.compare.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update next page to ${{ steps.prep_next.outputs.next }} and refresh last.txt"
          # نضمن إضافة كل من last.txt و next_page.txt
          file_pattern: |
            data/last.txt
            data/next_page.txt
          # صلاحيات الكتابة لتدفع التغييرات
          #repository: ${{ github.repository }}
          #branch: ${{ github.ref_name }}
          # إذا كان المستودع خاصاً قد تحتاج إلى:
          #   push: true
