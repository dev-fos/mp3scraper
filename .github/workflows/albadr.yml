name: HTML

on:
  push:
    branches: [dev]
  workflow_dispatch:        # تشغيل يدوي

jobs:
  fetch-and-extract:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 1️⃣ جلب نسخة من المستودع (مطلوب للـ git commit)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # احصل على التاريخ الكامل للسماح بالـ push

      # -------------------------------------------------
      # 2️⃣ قراءة رقم الصفحة الأخير (أو البدء من 360)
      # -------------------------------------------------
      - name: Get last page number
        id: get_page
        run: |
          if [[ -f al-badr/tafsir-assadi/next_mp3.txt ]]; then
            PAGE=$(cat al-badr/tafsir-assadi/next_mp3.txt)
          else
            PAGE=360
          fi
          echo "page=${PAGE}" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 3️⃣ بناء الرابط الكامل
      # -------------------------------------------------
      - name: Build URL
        id: build_url
        run: |
          BASE="https://www.al-badr.net/sub/456/?q=&page="
          URL="${BASE}${{ steps.get_page.outputs.page }}"
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Using page ${{ steps.get_page.outputs.page }} → $URL"

      # # -------------------------------------------------
      # # 4️⃣ تحميل الصفحة HTML
      # # -------------------------------------------------
      # - name: Download HTML page
      #   id: download
      #   run: |
      #     curl -sSL "${{ steps.build_url.outputs.url }}" -o page.html
      #     echo "file=page.html" >> $GITHUB_OUTPUT

      # # -------------------------------------------------
      # # 5️⃣ استخراج الأسطر المطلوبة
      # # -------------------------------------------------
      # - name: Extract required lines
      #   id: extract
      #   run: |
      #     grep "<h3>" "${{ steps.download.outputs.file }}" > h3_lines.txt || true
      #     grep "\.mp3" "${{ steps.download.outputs.file }}" > mp3_lines.txt || true
      #     cat h3_lines.txt mp3_lines.txt > result.txt
      #     echo "=== النتائج المستخرجة ==="
      #     cat result.txt
          
      # -------------------------------------------------
      # 4️⃣ تحميل → تنظيف بـ perl → استخراج الأسطر المطلوبة
      # -------------------------------------------------
      - name: Download, clean with Perl, and extract required lines
        id: extract
        run: |
          # عنوان الصفحة
          URL="${{ steps.build_url.outputs.url }}"
      
          # 1️⃣ تحميل الصفحة
          # 2️⃣ تطبيق قاعدة الاستبدال بـ perl (‑0777 يقرأ كل النص ككتلة واحدة)
          # 3️⃣ استخراج <h3> و .mp3 من التيار المُنقّى
          # 4️⃣ حفظ النتيجة المؤقتة في result.txt (يمكن إلغاؤها إذا لا تريد ملفاً نهائياً)
          curl -sSL "$URL" \
            | perl -0777 -pe '
                s{
                 <span>(.*)<span>
                }{}gsx;
                s{
                  <img(.*)</div>
                }{}gsx;
                s{
                  ^\\s+
                }{}gsx;
              ' \
            | tee >(grep "<h3>" > h3_lines.txt) \
                  >(grep "\.mp3" > mp3_lines.txt) \
                  > /dev/null
      
          # دمج النتائج في ملف واحد (إذا أردت الاحتفاظ به)
          cat h3_lines.txt mp3_lines.txt > result.txt
      
          echo "=== النتائج المستخرجة بعد تنظيف perl ==="
          cat result.txt

          
      # -------------------------------------------------
      # 6️⃣ **تحقق من وجود سطر ‎*.mp3*‎ – إذا لم يوجد → إيقاف**
      # -------------------------------------------------
      - name: Fail if no mp3 lines found
        id: check_mp3
        run: |
          if [[ -s mp3_lines.txt ]]; then
            echo "has_mp3=true" >> $GITHUB_OUTPUT
            echo "✅ تم العثور على سطر (أسطر) .mp3"
          else
            echo "has_mp3=false" >> $GITHUB_OUTPUT
            echo "⚠️ لا يوجد أي سطر يحتوي على .mp3"
          fi
          
      # -------------------------------------------------
      # 6️⃣ رفع النتيجة كـ artifact (اختياري)
      # -------------------------------------------------
      - name: Upload result
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extraction-result
          path: result.txt

      # -------------------------------------------------
      # 7️⃣ مقارنة النتيجة مع al-badr/tafsir-assadi/last_mp3.txt
      # -------------------------------------------------
      - name: Compare with previous result
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        id: compare
        run: |
          # إذا كان الملف السابق غير موجود نعتبره فارغاً
          if [[ ! -f al-badr/tafsir-assadi/last_mp3.txt ]]; then
            touch al-badr/tafsir-assadi/last_mp3.txt
          fi

          # استخدم diff لإيجاد الاختلافات
          if diff -q result.txt al-badr/tafsir-assadi/last_mp3.txt > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------
      # 8️⃣ إذا كان هناك اختلاف → تحديث al-badr/tafsir-assadi/last_mp3.txt
      # -------------------------------------------------
      - name: Update last_mp3.txt
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        run: |
          cp result.txt al-badr/tafsir-assadi/last_mp3.txt
          echo "تم تحديث al-badr/tafsir-assadi/last_mp3.txt بالنتائج الجديدة"

      # -------------------------------------------------
      # 9️⃣ حساب رقم الصفحة التالي وكتابته في الملف
      # -------------------------------------------------
      - name: Prepare next_mp3.txt
        id: prep_next
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'  # فقط إذا كان هناك تغيير
        run: |
          NEXT=$(( ${{ steps.get_page.outputs.page }} + 1 ))
          mkdir -p data
          echo "$NEXT" > al-badr/tafsir-assadi/next_mp3.txt
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 10️⃣ الالتزام بالملف المحدث
      # -------------------------------------------------
      #- name: Commit next_mp3.txt
      #  if: steps.compare.outputs.changed == 'true'
      #  uses: stefanzweifel/git-auto-commit-action@v5
      #  with:
      #    commit_message: "Update next page to ${{ steps.prep_next.outputs.next }}"
      #    file_pattern: "al-badr/tafsir-assadi/next_mp3.txt"

      - name: Commit updates
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update next page to ${{ steps.prep_next.outputs.next }} and refresh last_mp3.txt"
          # نضمن إضافة كل من last_mp3.txt و next_mp3.txt
          file_pattern: |
            al-badr/tafsir-assadi/last_mp3.txt
            al-badr/tafsir-assadi/next_mp3.txt
          # صلاحيات الكتابة لتدفع التغييرات
          #repository: ${{ github.repository }}
          #branch: ${{ github.ref_name }}
          # إذا كان المستودع خاصاً قد تحتاج إلى:
          #   push: true
