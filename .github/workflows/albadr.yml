name: HTML

on:
  push:
    branches: [dev]
  workflow_dispatch:        # تشغيل يدوي

jobs:
  fetch-and-extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # -------------------------------------------------
      # 1️⃣ جلب نسخة من المستودع (مطلوب للـ git commit)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # احصل على التاريخ الكامل للسماح بالـ push

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: dev-fos/islampodcast   # استبدل بـ <المنظمة>/<المستودع>
          token: ${{ secrets.R_token }}   # لا تحتاج PAT
          path: target-repo
          fetch-depth: 0
          
      #- name: Show repository file tree
      #  run: |
      #    echo "📂 شجرة المستودع المستنسخ (target‑repo):"
      #    # إذا كان الأمر tree مثبتًا فستظهر شجرة بألوان وتنسيق أفضل
      #    if command -v tree >/dev/null; then
      #      tree target-repo
      #    else
      #      # fallback إلى ls -R مع تنسيق واضح
      #      ls -R target-repo | sed 's/^/   /'
      #    fi          
      
      # -------------------------------------------------
      # 2️⃣ قراءة رقم الصفحة الأخير (أو البدء من 360)
      # -------------------------------------------------
      - name: Get last page number
        id: get_page
        run: |
          if [[ -f al-badr/tafsir-assadi/next_mp3.txt ]]; then
            PAGE=$(cat al-badr/tafsir-assadi/next_mp3.txt)
          else
            PAGE=360
          fi
          echo "page=${PAGE}" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 3️⃣ بناء الرابط الكامل
      # -------------------------------------------------
      - name: Build URL
        id: build_url
        run: |
          BASE="https://www.al-badr.net/sub/456/?q=&page="
          URL="${BASE}${{ steps.get_page.outputs.page }}"
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Using page ${{ steps.get_page.outputs.page }} → $URL"

      # # -------------------------------------------------
      # # 4️⃣ تحميل الصفحة HTML
      # # -------------------------------------------------
      # - name: Download HTML page
      #   id: download
      #   run: |
      #     curl -sSL "${{ steps.build_url.outputs.url }}" -o page.html
      #     echo "file=page.html" >> $GITHUB_OUTPUT

      # # -------------------------------------------------
      # # 5️⃣ استخراج الأسطر المطلوبة
      # # -------------------------------------------------
      # - name: Extract required lines
      #   id: extract
      #   run: |
      #     grep "<3>" "${{ steps.download.outputs.file }}" > h3_lines.txt || true
      #     grep "\.mp3" "${{ steps.download.outputs.file }}" > mp3_lines.txt || true
      #     cat h3_lines.txt mp3_lines.txt > result.txt
      #     echo "=== النتائج المستخرجة ==="
      #     cat result.txt
          
      # -------------------------------------------------
      # 4️⃣ تحميل → تنظيف بـ perl → استخراج الأسطر المطلوبة
      # -------------------------------------------------
      - name: Download, clean with Perl, and extract required lines
        id: extract
        run: |
          # عنوان الصفحة
          URL="${{ steps.build_url.outputs.url }}"
      
          # 1️⃣ تحميل الصفحة
          # 2️⃣ تطبيق قاعدة الاستبدال بـ perl (‑0777 يقرأ كل النص ككتلة واحدة)
          # 3️⃣ استخراج <h3> و .mp3 من التيار المُنقّى
          # 4️⃣ حفظ النتيجة المؤقتة في result.txt (يمكن إلغاؤها إذا لا تريد ملفاً نهائياً)
          curl -sSL "$URL" \
            | perl -0777 -pe '
                s{<h3>(.*)">}{<add key="eTitle0001" value="}g;
                s{</a></h3>}{" />}g;
                s{<span>(.*)<span>}{}g;
                s{href="/}{href="https://www.al-badr.net/}g;     
                s{<img(.*)</div>}{}g;
                s{U+202C}{}gm;
                s{^\s+}{}gm;               
              ' \
            | tee >(grep "eTitle" > h3_lines.txt) \
                  >(grep "\.mp3" > mp3_lines.txt) \
                  > /dev/null
      
          # دمج النتائج في ملف واحد (إذا أردت الاحتفاظ به)
          cat h3_lines.txt mp3_lines.txt > result.txt
      
          echo "=== النتائج المستخرجة بعد تنظيف perl ==="
          cat result.txt

          
      # -------------------------------------------------
      # 6️⃣ **تحقق من وجود سطر ‎*.mp3*‎ – إذا لم يوجد → إيقاف**
      # -------------------------------------------------
      - name: Fail if no mp3 lines found
        id: check_mp3
        run: |
          if [[ -s mp3_lines.txt ]]; then
            echo "has_mp3=true" >> $GITHUB_OUTPUT
            echo "✅ تم العثور على سطر (أسطر) .mp3"
          else
            echo "has_mp3=false" >> $GITHUB_OUTPUT
            echo "⚠️ لا يوجد أي سطر يحتوي على .mp3"
          fi
          
      # -------------------------------------------------
      # 6️⃣ رفع النتيجة كـ artifact (اختياري)
      # -------------------------------------------------
      #- name: Upload result
      #  if: steps.check_mp3.outputs.has_mp3 == 'true'
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: extraction-result
      #    path: result.txt

      # -------------------------------------------------
      # 7️⃣ مقارنة النتيجة مع al-badr/tafsir-assadi/last_mp3.txt
      # -------------------------------------------------
      - name: Compare with previous result
        if: steps.check_mp3.outputs.has_mp3 == 'true'
        id: compare
        run: |
          # إذا كان الملف السابق غير موجود نعتبره فارغاً
          if [[ ! -f al-badr/tafsir-assadi/last_mp3.txt ]]; then
            touch al-badr/tafsir-assadi/last_mp3.txt
          fi

          # استخدم diff لإيجاد الاختلافات
          if diff -q result.txt al-badr/tafsir-assadi/last_mp3.txt > /dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------
      # 8️⃣ إذا كان هناك اختلاف → تحديث al-badr/tafsir-assadi/last_mp3.txt
      # -------------------------------------------------
      - name: Update last_mp3.txt
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        run: |
          cp mp3_lines.txt al-badr/tafsir-assadi/last_mp3.txt
          echo "تم تحديث al-badr/tafsir-assadi/last_mp3.txt بالنتائج الجديدة"
          
      - name: Update last_mp3.txt in target repo
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        run: |
          cp mp3_lines.txt target-repo/mp3-url/al-badr-tafsir-assidi.html
          echo "تم تحديث al-badr/tafsir-assadi/last_mp3.txt بالنتائج الجديدة"
          
      - name: Commit & push changes
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        working-directory: target-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mp3-url/al-badr-tafsir-assidi.html
          git commit -m "Update last_mp3.txt with new results"
          git push origin HEAD:main

      # 2️⃣ تعريف مسار الملف (احرص على وضعه داخل علامات اقتباس)
      - name: Define file path
        id: vars
        run: |
          echo "FILE=mp3scraper/bin/Release/mp3scraper.exe.config" >> $GITHUB_OUTPUT
          
      - name: Build replacement block
        id: build
        env:
          TEXT_BEFORE: |
            <appSettings>
                <add key="url0001" value="https://raw.githubusercontent.com/dev-fos/islampodcast/main/mp3-url/al-badr-tafsir-assidi.html"/>
                <add key="destBase0001" value="شرح-تفسير-السعدي-(تيسير-الكريم-الرحمن-في-تفسير-كلام-المنان).xml"/>    
                <add key="guidPrefix0001" value="شرح تفسير السعدي (تيسير الكريم الرحمن في تفسير كلام المنان) - "/>   
                <add key="channelTitle0001" value="شرح تفسير السعدي | الشيخ د. عبد الرزاق بن عبد المحسن البدر"/>    
                <add key="channelUrl0001" value="https://www.al-badr.net/sub/456"/>
                <add key="channelLogo0001" value="https://d3wo5wojvuv7l.cloudfront.net/t_rss_itunes_square_1400/images.spreaker.com/original/8f275333de429c9ced6128a8dff756e3.jpg"/>   
                <add key="channelDescription0001" value="يقول الشيخ العثيمين  في التعريف بهذا التفسير، في تقديمه له: انه من أحسن التفاسير حيث كان له ميزات كثيرة :- منها: سهولة العبارة ووضوحها. ومنها: تجنب الحشو والتطويل الذي لا فائدة منه. ومنها: تجنب ذكر الخلاف، إلا أن يكون الخلاف قويًّا تدعو الحاجة إلى ذكره. ومنها: السير على منهج السلف في آيات الصفات، فلا تحريف ولا تأويل يخالف مراد الله بكلامه. ومنها: دقة الاستنباط فيما تدل عليه الآيات من الفوائد والأحكام والحكم. ومنها: أنه كتاب تفسير وتربية على الأخلاق الفاضلة.
            (لمؤلفه عبد الرحمن بن ناصر السعدي) ."/>
                <add key="itemDescription0001" value="• كتاب : تفسير السعدي (تيسير الكريم الرحمن في تفسير كلام المنان) 
            
            • المؤلف : عبد الرحمن بن ناصر السعدي
            
            • تعليق : الشيخ / د. عبدالرزاق بن عبد المحسن البدر
            
            • للمزيد , تابعنا على قناة التيليجرام :
            https://t.me/islampodcast1
            "/>
                <add key="mp3Bitrat0001" value="48"/>
                <add key="Title0001" value="true"/>
          TEXT_AFTER: |
           <add key="episodesBeginning0001" value="1"/>
        run: |
          # النص الثابت المطلوب وضعه في البداية
            
          # قراءة محتوى h3_lines.txt (يمكن أن يحتوي على عدة أسطر)
          RESULT=$(<h3_lines.txt)

          # دمج النص الثابت مع المحت

          REPLACEMENT="${TEXT_BEFORE}"$'\n'"${RESULT}"$'\n'"${TEXT_AFTER}"
          
          echo "merged<<EOF" >> $GITHUB_OUTPUT
          echo "REPLACEMENT"      >> $GITHUB_OUTPUT
          echo "EOF"          >> $GITHUB_OUTPUT
          
          # هروب سطور جديدة لأن GitHub Actions يتعامل مع قيمة واحدة في السطر
          REPLACEMENT_ESCAPED="${REPLACEMENT//$'\n'/\\n}"
          
          echo "replacement<<EOF" >> $GITHUB_OUTPUT
          echo "$REPLACEMENT_ESCAPED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        
 
      # 3️⃣ البحث / الاستبدال باستخدام perl (regex مع وضع التعليقات)
      - name: Update mp3scraper.exe.config
        env:
          FILE: ${{ steps.vars.outputs.FILE }}
          REPLACEMENT: ${{ steps.build.outputs.replacement }}
        run: |
          perl -0777 -i -pe '
            s{<appSettings>.*?<add\s+key="episodesBeginning0001"[^>]*>}
             {
             $ENV{REPLACEMENT}
             }gs;  
            s{
             </channel>\s*</rss>\s*
              }{}gsx;  
          ' "$FILE"

          # تحقق سريع من النتائج (اختياري)
          echo "=== عينة من الملف بعد الاستبدال ==="
          head -n 20 "$FILE"
          
      # -------------------------------------------------
      # 9️⃣ حساب رقم الصفحة التالي وكتابته في الملف
      # -------------------------------------------------
      - name: Prepare next_mp3.txt
        id: prep_next
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'  # فقط إذا كان هناك تغيير
        run: |
          NEXT=$(( ${{ steps.get_page.outputs.page }} + 1 ))
          echo "$NEXT" > al-badr/tafsir-assadi/next_mp3.txt
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      # -------------------------------------------------
      # 10️⃣ الالتزام بالملف المحدث
      # -------------------------------------------------
      - name: Commit next_mp3.txt
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update next page to ${{ steps.prep_next.outputs.next }}"
          file_pattern: "al-badr/tafsir-assadi/next_mp3.txt"

      - name: Commit updates
        if: steps.compare.outputs.changed == 'true' && steps.check_mp3.outputs.has_mp3 == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update next page to ${{ steps.prep_next.outputs.next }} and refresh last_mp3.txt"
          # نضمن إضافة كل من last_mp3.txt و next_mp3.txt
          file_pattern: |
            al-badr/tafsir-assadi/last_mp3.txt
            al-badr/tafsir-assadi/next_mp3.txt
          # صلاحيات الكتابة لتدفع التغييرات
          #repository: ${{ github.repository }}
          #branch: ${{ github.ref_name }}
          # إذا كان المستودع خاصاً قد تحتاج إلى:
          #   push: true
