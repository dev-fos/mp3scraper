name: albadr tafsir-assadi update
run-name:  إضافة درس - شرح تفسير السعدي | الشيخ د. عبدالرزاق البدر

on:
  push:
    paths:
      - "mp3scraper/bin/Release/podcasts/شرح-تفسير-السعدي-(تيسير-الكريم-الرحمن-في-تفسير-كلام-المنان).xml"  # تشغيل فقط عند تعديل هذا الملف         
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # 1️⃣ سحب الشيفرة
      - name: Checkout repository
        uses: actions/checkout@v6
        with: 
          fetch-depth: 0   # احصل على التاريخ الكامل للسماح بالـ push
          persist-credentials: true
          token: ${{ secrets.R_token }}  

      # 2️⃣ تعريف مسار الملف (احرص على وضعه داخل علامات اقتباس)
      - name: Define file path
        id: vars
        run: |
          echo "FILE=mp3scraper/bin/Release/podcasts/شرح-تفسير-السعدي-(تيسير-الكريم-الرحمن-في-تفسير-كلام-المنان).xml" >> $GITHUB_OUTPUT

      # 3️⃣ البحث / الاستبدال باستخدام perl (regex مع وضع التعليقات)
      - name: Get new item
        id: get_item
        env:
          FILE: ${{ steps.vars.outputs.FILE }}
        run: |
          perl -0777 -i -pe '
            s{
              <\?xml\s+version="1\.0"\s+encoding="utf-8"\?>
              .*?
              </image>
              }{}gsx;  
            s{
             </channel>\s*</rss>\s*
              }{}gsx;  
          ' "$FILE"

          echo "line=$FILE" >> "$GITHUB_OUTPUT"
                    
          echo "=== عينة من الملف بعد الاستبدال ==="
          head -n 50 "$FILE"    
          
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: dev-fos/islampodcast   # استبدل بـ <المنظمة>/<المستودع>
          token: ${{ secrets.R_token }}   # لا تحتاج PAT
          path: target-repo
          fetch-depth: 0
          persist-credentials: true
          
      - name: Define target file path
        id: vars2
        run: |
          echo "FILE=target-repo/عبدالرزاق-البدر/التفسير-وعلوم-القرآن/شرح-تفسير-السعدي-(تيسير-الكريم-الرحمن-في-تفسير-كلام-المنان).xml" >> $GITHUB_OUTPUT

      - name: Update podcast in target repo
        env:
          FILE: ${{ steps.vars2.outputs.FILE }}
          LINES_FILE: ${{ steps.get_item.outputs.line }}
        run: |
          cat  $LINES_FILE

          # قراءة محتوى LINES_FILE في متغيّر Bash
          INSERT=$(cat "$LINES_FILE")

          
          perl -0777 -i -pe ' 
            s{
             </channel>\s*</rss>\s*
              }{
                ${INSERT}
                ${{ steps.get_item.outputs.line }}
                </channel>
              </rss>
              }gsx;  
          ' "$FILE"
          echo "=== عينة من الملف بعد الاستبدال ==="
          tail -n 50 "$FILE"
          
