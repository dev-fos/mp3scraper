name: Search and replace in file

on:
  push:
    branches: [ dev ]          # أو أي فرع تريد تشغيل الإجراء عليه
  workflow_dispatch:           # لتشغيله يدوياً من واجهة GitHub

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ سحب الشيفرة
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ تعريف مسار الملف (احرص على وضعه داخل علامات اقتباس)
      - name: Define file path
        id: vars
        run: |
          echo "FILE=mp3scraper/bin/Release/podcasts/شرح-تفسير-السعدي-(تيسير-الكريم-الرحمن-في-تفسير-كلام-المنان).xml" >> $GITHUB_OUTPUT

      # 3️⃣ البحث / الاستبدال باستخدام perl (regex مع وضع التعليقات)
      - name: Replace <title>…</title> with ttttt
        env:
          FILE: ${{ steps.vars.outputs.FILE }}
        run: |
          perl -0777 -i -pe '
            s{
              <\?xml\s+version="1\.0"\s+encoding="utf-8"\?>
              .*?
              </image>
              }{}gsx;  
            s{
             </channel>\s*</rss>\s*
              }{}gsx;  
          ' "$FILE"

          # تحقق سريع من النتائج (اختياري)
          echo "=== عينة من الملف بعد الاستبدال ==="
          head -n 20 "$FILE"

      # 4️⃣ رفع التغييرات (commit+push)
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔧 استبدال وسوم <title> بـ ttttt"
          branch: ${{ github.ref_name }}
