name: Run Windows Executable

on:
  push:
    paths:
      - mp3scraper/bin/Release/mp3scraper.exe.config   # تشغيل فقط عند تعديل هذا الملف         
      - al-badr/تفسير-السعدي/mp3scraper.exe.config
  workflow_dispatch:

permissions:
  contents: write   

jobs:
  run-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.R_token }}

      - name: Debug event payload
        run: |
            $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            Write-Host "Event name: ${{ github.event_name }}"
            Write-Host "head_commit exists? $($event.head_commit -ne $null)"
            if ($event.head_commit) {
              Write-Host "head_commit.modified:" 
              $event.head_commit.modified | ForEach-Object { Write-Host "  $_" }
            }
            # إذا كان حدث push قد لا يأتي بـ head_commit، جرب قراءة commits array
            if ($event.commits) {
              Write-Host "commits array contains:" 
              $event.commits | ForEach-Object {
                $_.modified | ForEach-Object { Write-Host "  $_" }
              }
            }
  
      - name: Determine which trigger fired
        id: which2
        run: |
          # قراءة محتوى event.json
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
      
          # ---------- تجميع أسماء الملفات ----------
          $modified = @()
      
          # 1️⃣ إذا كان هناك commit واحد (head_commit موجود)
          if ($event.head_commit?.modified) {
            $modified += $event.head_commit.modified
          }
          # 2️⃣ إذا كان هناك أكثر من commit (مصفوفة commits)
          if ($event.commits) {
            foreach ($c in $event.commits) {
              if ($c.modified) { $modified += $c.modified }
              # إذا تريد أن تدمج الملفات المضافة أو المزالة أيضاً:
              # if ($c.added)   { $modified += $c.added }
              # if ($c.removed) { $modified += $c.removed }
            }
          }
      
          # إظهار ما تم جمعه (للتصحيح)
          Write-Host "الملفات التي تم جمعها:"
          $modified | ForEach-Object { Write-Host "  $_" }
      
          # ---------- تحديد الـ trigger ----------
          $trigger = 'none'
          foreach ($file in $modified) {
            if ($file -eq 'mp3scraper/bin/Release/mp3scraper.exe.config') {
              $trigger = 'Release'
              break
            }
            elseif ($file -eq 'al-badr/تفسير-السعدي/mp3scraper.exe.config') {
              $trigger = 'al-badr'
              break
            }
          }
      
          # ---------- إخراج النتيجة ----------
          "trigger=$trigger" >> $env:GITHUB_OUTPUT
          Write-Host "تم اختيار trigger = $trigger &  $event.head_commit.modified & $env:GITHUB_EVENT_PATH"
     
      - name: Determine which trigger fired
        id: which
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
      
          # استخراج قائمة الملفات المعدّلة (إن وجدت)
          $modified = @()
          if ($event.head_commit?.modified) {
            $modified = $event.head_commit.modified
          }
      
          # الافتراضية: لا يوجد trigger
          $trigger = 'none'
      
          # فحص كل ملف في القائمة
          foreach ($file in $modified) {
            if ($file -eq 'mp3scraper/bin/Release/mp3scraper.exe.config') {
              $trigger = 'Release'
              break
            }
            elseif ($file -eq 'al-badr/تفسير-السعدي/mp3scraper.exe.config') {
              $trigger = 'al-badr'
              break
            }
          }
      
          # إرسال القيمة إلى GitHub Outputs
          "trigger=$trigger" >> $env:GITHUB_OUTPUT
      
          # طباعة النتيجة لتظهر في logs
          Write-Host "تم اختيار trigger = $trigger & $event.head_commit.modified & $event"

      # 2️⃣ فلترة المسارات
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # تعريف مجموعة “Release”
          filters: |
            release:
              - 'mp3scraper/bin/Release/mp3scraper.exe.config'
            albadr:
              - 'al-badr/تفسير-السعدي/mp3scraper.exe.config'

      # 3️⃣ إظهار ما تم اكتشافه (للتصحيح)
      - name: Debug – show filter results
        run: |
          echo "release  = ${{ steps.filter.outputs.release }}"
          echo "albadr   = ${{ steps.filter.outputs.albadr }}"

      # 4️⃣ تشغيل النسخة المناسبة
      - name: Run Release build
        if: ${{ steps.filter.outputs.release == 'true' }}
        run: |
          echo "تشغيل نسخة Release …"
          # ضع هنا أوامر تشغيل exe للـ Release

      - name: Run al‑badr build
        if: ${{ steps.filter.outputs.albadr == 'true' }}
        run: |
          echo "تشغيل نسخة al‑badr …"
          # ضع هنا أوامر تشغيل exe للـ al‑badr

- name: Determine trigger with github-script
  id: which
  uses: actions/github-script@v7
  with:
    script: |
      const event = context.payload;

      // تجميع الملفات المعدّلة من جميع الـ commits
      let modified = [];
      if (event.head_commit?.modified) {
        modified = modified.concat(event.head_commit.modified);
      }
      if (event.commits) {
        for (const c of event.commits) {
          if (c.modified) modified = modified.concat(c.modified);
        }
      }

      // طباعة للمراجعة
      console.log('Modified files:', modified);

      // تحديد الـ trigger
      let trigger = 'none';
      if (modified.includes('mp3scraper/bin/Release/mp3scraper.exe.config')) {
        trigger = 'Release';
      } else if (modified.includes('al-badr/تفسير-السعدي/mp3scraper.exe.config')) {
        trigger = 'al-badr';
      }

      core.setOutput('trigger', trigger);
      console.log('trigger =', trigger);
