yaml


- name: Run Release build
  if: ${{ steps.which.outputs.trigger == 'Release' }}
  run: echo "تشغيل Release …"

- name: Run al‑badr build
  if: ${{ steps.which.outputs.trigger == 'al-badr' }}
  run: echo "تشغيل al‑badr …"
لماذا تُفضِّل هذه الـ Actions؟
الميزة	dorny/paths-filter	actions/github-script
لا تحتاج للـ PowerShell	✅ لا تحتاج كتابة سكريبت يدوي لتجميع الـ commits.	✅ الكود قصير ومباشر.
يدعم دفعات متعددة commits	✅ يتعامل مع commits تلقائيًا.	✅ يمكنك جمع الـ modified من جميع العناصر.
قابلية الصيانة	✅ تعديل المسارات فقط في قسم filters.	✅ تعديل أسماء الملفات في مصفوفة JavaScript.
إخراج واضح	✅ true/false لكل مجموعة مسارات.	✅ أي قيمة تريد إرجاعها كـ output.
خطوات التحقق من أن الفلترة تعمل (اختبار سريع)
إجراء تعديل بسيط على أحد المسارين (مثلاً mp3scraper/bin/Release/mp3scraper.exe.config).
ادفع الـ commit إلى الفرع المراقَب (dev في مثالنا).
بعد انتهاء الـ workflow، افتح صفحة Actions → Run # وتفقد خطوة Debug – show filter results. يجب أن ترى:


release  = true
albadr   = false
أو العكس إذا عدّلت ملف al-badr/....

إذا كانت القيم كلها false، تأكد من أن المسارات في filters: مطابقة تمامًا للمسارات داخل المستودع (حسّاس لحالة الأحرف والمسافات).

ملخص سريع
استبدل سكريبت PowerShell المعقّد بـ dorny/paths-filter أو actions/github-script.
كلاهما يقرأ كل الـ commits في الـ push ويعطيك إما true/false أو قيمة مخصصة (مثل Release / al-badr).
أضف خطوة تصحيح (echo) لتتأكد من القيم قبل تشغيل القضايا الفعلية.
بهذا ستحصل على طريقة موثوقة وسهلة الصيانة لتحديد أي ملف فعل الـ trigger وتشغيل الـ exe المناسب. Happy GitHub Actions!`



      
      - name: Run appropriate exe
        if: steps.which.outputs.trigger != 'none'   # (اختياري)
        run: |
          $trigger = "${{ steps.which.outputs.trigger }}"
      
          if ($trigger -eq 'Release') {
              & ".\mp3scraper\bin\Release\mp3scraper.exe"
              # ضع أمر exe_config هنا إذا لزم
          }
          elseif ($trigger -eq 'al-badr') {
              & ".\al-badr\تفسير-السعدي\mp3scraper.exe"
              # ضع أمر src_changes هنا إذا لزم
          }



      - name: Upload generated file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.run_id }}
          path: .\mp3scraper\bin\Release\podcasts\
       #   archive: false
          compression-level: 9
          if-no-files-found: ignore

      # 4️⃣ إضافة الملف المُولَّد إلى المستودع نفسه
      - name: Commit generated files back to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mp3scraper/bin/Release/podcasts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add generated podcasts (auto‑generated by workflow)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.R_token }}
